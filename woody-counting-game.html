<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>眼動儀遊戲 - 胡迪數數</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000000;
        }

        body {
            position: relative;
        }

        #startPage {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .start-woody {
            width: min(55vw, 420px);
            height: min(55vw, 420px);
            max-width: 420px;
            max-height: 420px;
            object-fit: contain;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
        }

        #gamePage {
            position: absolute;
            inset: 0;
            display: none;
            background: #000000;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .woody {
            position: absolute;
            width: 200px;
            height: 200px;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.04s linear;
            cursor: pointer;
        }

        .woody img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
        }

        .woody.popped {
            opacity: 0;
            pointer-events: none;
        }

        .counter {
            position: fixed;
            top: 28px;
            right: 28px;
            font-size: clamp(32px, 4vw, 52px);
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px 22px;
            border-radius: 18px;
            z-index: 20;
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }

        .info-text {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.25);
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 20;
        }

        .gaze-indicator {
            position: fixed;
            width: 58px;
            height: 58px;
            border: 3px solid rgba(255, 0, 255, 0.9);
            border-radius: 50%;
            background: rgba(255, 0, 255, 0.18);
            box-shadow: 0 0 18px rgba(255,0,255,0.8);
            pointer-events: none;
            z-index: 200;
        }

        #endPage {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #000000;
            text-align: center;
        }

        .celebration {
            font-size: clamp(52px, 7vw, 90px);
            color: white;
            font-weight: bold;
            margin-bottom: 26px;
            text-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .final-score {
            font-size: clamp(28px, 4vw, 48px);
            color: white;
            background: rgba(0,0,0,0.18);
            padding: 18px 30px;
            border-radius: 20px;
            margin-bottom: 28px;
            font-weight: bold;
        }

        .restart-btn {
            background: linear-gradient(135deg, #c4a035, #8B4513);
            color: white;
            font-size: clamp(26px, 3vw, 36px);
            font-weight: bold;
            border: none;
            border-radius: 30px;
            padding: 18px 34px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0,0,0,0.2);
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        .particle-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: particleFly 0.9s ease-out forwards;
        }

        @keyframes particleFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .confetti {
            position: fixed;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

    <div id="gamePage">
        <div id="counter" class="counter">🤠 1</div>
        <div id="gameContainer" class="game-container"></div>
    </div>

    <div id="endPage">
        <div class="celebration">🎉 完成！ 🎉</div>
        <div class="final-score">總共完成 20 個胡迪</div>
        <button class="restart-btn" onclick="location.reload()">再玩一次</button>
    </div>

    <script>
        const TOTAL_ROUNDS = 20;
        const GAZE_DURATION = 1000;

        const CANTONESE_NUMBERS = {
            1: '一', 2: '二', 3: '三', 4: '四', 5: '五',
            6: '六', 7: '七', 8: '八', 9: '九', 10: '十',
            11: '十一', 12: '十二', 13: '十三', 14: '十四', 15: '十五',
            16: '十六', 17: '十七', 18: '十八', 19: '十九', 20: '二十'
        };

        // 胡迪官方造型圖：開始頁 <img> 已嵌入 base64，遊戲目標共用同一 src
        const WOODY_IMG_SRC = document.querySelector('.start-woody').getAttribute('src');

        let currentRound = 1;
        let totalWoodysInRound = 1;
        let woodysPoppedInRound = 0;
        let mouseX = 0, mouseY = 0;
        let currentGazeTarget = null;
        let gazeIntervalId = null;
        let gazeStartTime = null;
        let activeAudioContext = null;
        let cantoneseVoice = null;
        let voicesReady = false;

        let startWoody = document.querySelector('.start-woody');

        function makeWoodyImg() {
            return `<img src="${WOODY_IMG_SRC}" alt="胡迪" draggable="false" />`;
        }

        function initAudioContext() {
            try {
                if (!activeAudioContext) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    activeAudioContext = new AudioCtx();
                }
                
                if (activeAudioContext.state === 'suspended') {
                    activeAudioContext.resume().then(() => {
                        playBackgroundMusic();
                    }).catch(() => {});
                } else {
                    playBackgroundMusic();
                }
            } catch (e) {
                console.log('音訊初始化錯誤：', e);
            }
        }

        function init() {
            bindStartWoody();
            updateGazeIndicator();

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                updateGazeIndicator();
                handleGazeFromMouse(mouseX, mouseY);
            });

            const unlockAudio = () => {
                initAudioContext();
                try {
                    if (window.speechSynthesis) {
                        window.speechSynthesis.getVoices();
                    }
                } catch (e) {}
                document.removeEventListener('pointerdown', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);
            };
            document.addEventListener('pointerdown', unlockAudio, { once: true });
            document.addEventListener('keydown', unlockAudio, { once: true });
        }

        function bindStartWoody() {
            startWoody.addEventListener('mouseenter', () => {
                startGazeTimer(startWoody);
            });
            startWoody.addEventListener('mouseleave', stopGazeTimer);
            startWoody.addEventListener('click', startGame);
        }

        function startGame() {
            initAudioContext();
            try {
                if (activeAudioContext && activeAudioContext.state === 'suspended') {
                    activeAudioContext.resume();
                }
            } catch (e) {}

            waitForVoices().then(() => {
                try {
                    if ('speechSynthesis' in window) {
                        const warmup = new SpeechSynthesisUtterance(' ');
                        warmup.volume = 0;
                        warmup.rate = 10;
                        if (cantoneseVoice) warmup.voice = cantoneseVoice;
                        warmup.lang = cantoneseVoice?.lang || 'zh-HK';
                        window.speechSynthesis.speak(warmup);
                        setTimeout(() => window.speechSynthesis.cancel(), 20);
                    }
                } catch (e) {}
            });

            document.getElementById('startPage').style.display = 'none';
            document.getElementById('gamePage').style.display = 'block';
            currentRound = 1;
            woodysPoppedInRound = 0;
            totalWoodysInRound = currentRound;
            createRoundWoodys();
            updateCounter();
        }

        function updateCounter() {
            document.getElementById('counter').textContent = `🤠 ${currentRound}`;
        }

        function createRoundWoodys() {
            const container = document.getElementById('gameContainer');
            container.innerHTML = '';
            totalWoodysInRound = currentRound;
            woodysPoppedInRound = 0;

            const positions = generateCenterFirstPositions(totalWoodysInRound);

            positions.forEach((pos, idx) => {
                const woody = document.createElement('div');
                woody.className = 'woody';
                woody.style.left = pos.x + 'px';
                woody.style.top = pos.y + 'px';
                // 官方 PNG 為方形近鏡，寬高一致
                woody.style.width = pos.size + 'px';
                woody.style.height = pos.size + 'px';

                woody.innerHTML = makeWoodyImg();

                woody.addEventListener('mouseenter', () => {
                    startGazeTimer(woody);
                });

                woody.addEventListener('mouseleave', () => {
                    if (currentGazeTarget === woody) stopGazeTimer();
                });

                container.appendChild(woody);
            });
        }

        function generateCenterFirstPositions(count) {
            // 依螢幕比例選擇欄列，並縮小人偶以確保完整顯示在畫面內。
            const containerW = Math.max(1, window.innerWidth);
            const containerH = Math.max(1, window.innerHeight);
            const padding = 12;
            // 官方 PNG 為方形近鏡
            const aspectH = 1;

            let best = null;
            for (let cols = 1; cols <= count; cols++) {
                const rows = Math.ceil(count / cols);
                const sizeByW = (containerW - padding * 2) / cols;
                const sizeByH = (containerH - padding * 2) / (rows * aspectH);
                const size = Math.min(200, sizeByW, sizeByH);
                if (!best || size > best.size) best = { cols, rows, size };
            }

            const { cols, rows, size } = best;
            const itemH = size * aspectH;
            const cellW = containerW / cols;
            const cellH = containerH / rows;
            const positions = [];

            for (let i = 0; i < count; i++) {
                const r = Math.floor(i / cols);
                const c = i % cols;
                const x = Math.max(padding, Math.min(containerW - size - padding, c * cellW + (cellW - size) / 2));
                const y = Math.max(padding, Math.min(containerH - itemH - padding, r * cellH + (cellH - itemH) / 2));
                positions.push({ x, y, size });
            }

            const cx = containerW / 2 - size / 2;
            const cy = containerH / 2 - itemH / 2;
            positions.sort((a, b) =>
                Math.hypot(a.x - cx, a.y - cy) - Math.hypot(b.x - cx, b.y - cy)
            );
            return positions;
        }

        function handleGazeFromMouse(mouseX, mouseY) {
            if (!document.getElementById('gamePage').style.display || document.getElementById('gamePage').style.display === 'none') return;

            const target = document.elementFromPoint(mouseX, mouseY);
            if (!target) return;

            const woody = target.closest('.woody');
            if (woody) {
                startGazeTimer(woody);
            } else if (currentGazeTarget) {
                stopGazeTimer();
            }
        }

        function startGazeTimer(element) {
            if (!element) return;

            if (element === startWoody) {
                currentGazeTarget = element;
            } else if (!element.classList.contains('woody')) {
                return;
            }

            if (currentGazeTarget === element && gazeIntervalId) return;

            stopGazeTimer();
            currentGazeTarget = element;
            gazeStartTime = performance.now();

            gazeIntervalId = setInterval(() => {
                if (!currentGazeTarget || !gazeStartTime) return;

                const elapsed = performance.now() - gazeStartTime;
                const progress = Math.min(elapsed / GAZE_DURATION, 1);
                const scale = 1 + progress * 0.3;

                currentGazeTarget.style.transform = `scale(${scale})`;

                if (elapsed >= GAZE_DURATION) {
                    triggerGazeComplete();
                }
            }, 30);
        }

        function stopGazeTimer() {
            if (gazeIntervalId) {
                clearInterval(gazeIntervalId);
                gazeIntervalId = null;
            }

            if (currentGazeTarget) {
                currentGazeTarget.style.transform = 'scale(1)';
                currentGazeTarget = null;
            }

            gazeStartTime = null;
        }

        function triggerGazeComplete() {
            if (!currentGazeTarget) return;

            const target = currentGazeTarget;

            if (target === startWoody) {
                startGame();
                stopGazeTimer();
                return;
            }

            if (target.classList.contains('woody')) {
                popWoody(target);
            }

            stopGazeTimer();
        }

        function popWoody(woody) {
            if (!woody || woody.classList.contains('popped')) return;

            woody.classList.add('popped');
            playPopSound();
            createExplosion(woody);

            woodysPoppedInRound++;
            speakNumber(woodysPoppedInRound);

            if (woodysPoppedInRound >= totalWoodysInRound) {
                setTimeout(() => {
                    speakText(`${totalWoodysInRound}個`);

                    setTimeout(() => {
                        if (currentRound >= TOTAL_ROUNDS) {
                            endGame();
                        } else {
                            currentRound++;
                            updateCounter();
                            createRoundWoodys();
                            speakText(`${currentRound}個`);
                        }
                    }, 1200);
                }, 500);
            }
        }

        function endGame() {
            document.getElementById('gamePage').style.display = 'none';
            document.getElementById('endPage').style.display = 'flex';
            createConfetti();
            playCelebrationSound();
            speakText(`全部完成，總共有${TOTAL_ROUNDS}個胡迪`);
        }

        function createExplosion(woodyElement) {
            const rect = woodyElement.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            // 胡迪配色：棕、黃、藍牛仔、米白
            const colors = ['#8B5A2B', '#F4C430', '#3B6EA5', '#F5F0E1', '#6B3A1F', '#DAA520', '#F5CBA7', '#4A3728'];

            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';

                const dot = document.createElement('div');
                dot.className = 'particle-dot';
                dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = (i / 30) * Math.PI * 2;
                const distance = 280 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                dot.style.setProperty('--tx', tx + 'px');
                dot.style.setProperty('--ty', ty + 'px');

                particle.appendChild(dot);
                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 900);
            }
        }

        function createConfetti() {
            const confettiColors = ['#8B5A2B', '#F4C430', '#3B6EA5', '#F5F0E1', '#6B3A1F', '#DAA520', '#F5CBA7', '#4169E1'];
            for (let i = 0; i < 50; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * window.innerWidth + 'px';
                c.style.top = '-20px';
                c.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                c.style.animation = `fall ${2 + Math.random() * 2}s linear forwards`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }

            const style = document.createElement('style');
            style.textContent = `
                @keyframes fall {
                    to {
                        opacity: 0;
                        transform: translateY(${window.innerHeight + 100}px) rotateZ(360deg);
                    }
                }
            `;
            document.head.appendChild(style);
        }

        function playBackgroundMusic() {
            try {
                if (!activeAudioContext) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    activeAudioContext = new AudioCtx();
                }

                const ctx = activeAudioContext;
                const notes = [440, 494, 523, 587, 659, 587, 523, 494];
                let nextStart = ctx.currentTime + 0.02;

                function playLoop() {
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        const t = nextStart + idx * 0.18;
                        gain.gain.setValueAtTime(0.15, t);
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
                        osc.start(t);
                        osc.stop(t + 0.16);
                    });

                    nextStart += 1.5;
                    setTimeout(playLoop, 1500);
                }

                playLoop();
            } catch (e) {
                console.log('背景音樂錯誤：', e);
            }
        }

        function playPopSound() {
            try {
                if (!activeAudioContext) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    activeAudioContext = new AudioCtx();
                }

                const ctx = activeAudioContext;
                const now = ctx.currentTime;

                const configs = [
                    { type: 'sine', f1: 1200, f2: 200, gain: 0.85, dur: 0.18 },
                    { type: 'sine', f1: 300, f2: 50, gain: 0.95, dur: 0.22 },
                    { type: 'sine', f1: 800, f2: 160, gain: 0.72, dur: 0.13 },
                    { type: 'square', f1: 2000, f2: 700, gain: 0.65, dur: 0.09 }
                ];

                configs.forEach((cfg, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = cfg.type;
                    osc.frequency.setValueAtTime(cfg.f1, now + idx * 0.02);
                    osc.frequency.exponentialRampToValueAtTime(cfg.f2, now + idx * 0.02 + cfg.dur);

                    gain.gain.setValueAtTime(cfg.gain, now + idx * 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.02 + cfg.dur);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + idx * 0.02);
                    osc.stop(now + idx * 0.02 + cfg.dur);
                });
            } catch (e) {
                console.log('爆破音效錯誤：', e);
            }
        }

        function playCelebrationSound() {
            try {
                if (!activeAudioContext) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    activeAudioContext = new AudioCtx();
                }

                const ctx = activeAudioContext;
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.5, 1046.5, 783.99, 659.25];

                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    const t = now + idx * 0.15;
                    gain.gain.setValueAtTime(0.35, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
                    osc.start(t);
                    osc.stop(t + 0.28);
                });
            } catch (e) {
                console.log('結束音效錯誤：', e);
            }
        }

        function loadCantoneseVoice() {
            if (!('speechSynthesis' in window)) return null;

            const voices = window.speechSynthesis.getVoices() || [];

            cantoneseVoice =
                voices.find(v => /^zh-HK$/i.test(v.lang)) ||
                voices.find(v => /^yue[-_]HK$/i.test(v.lang)) ||
                voices.find(v => /zh[-_]HK/i.test(v.lang)) ||
                voices.find(v => /yue/i.test(v.lang)) ||
                voices.find(v => /Cantonese|粵語|廣東話/i.test(v.name)) ||
                null;

            voicesReady = voices.length > 0;
            return cantoneseVoice;
        }

        function waitForVoices(timeout = 2500) {
            return new Promise(resolve => {
                if (!('speechSynthesis' in window)) {
                    resolve(null);
                    return;
                }

                const existing = loadCantoneseVoice();
                if (existing) {
                    resolve(existing);
                    return;
                }

                let finished = false;

                const finish = () => {
                    if (finished) return;
                    finished = true;
                    window.speechSynthesis.removeEventListener('voiceschanged', onChanged);
                    resolve(loadCantoneseVoice());
                };

                const onChanged = () => {
                    if (loadCantoneseVoice()) finish();
                };

                window.speechSynthesis.addEventListener('voiceschanged', onChanged);

                const timer = setInterval(() => {
                    if (loadCantoneseVoice()) {
                        clearInterval(timer);
                        finish();
                    }
                }, 100);

                setTimeout(() => {
                    clearInterval(timer);
                    finish();
                }, timeout);
            });
        }

        async function speakText(text) {
            try {
                if (!('speechSynthesis' in window)) {
                    console.log('此瀏覽器不支援粵語語音');
                    return;
                }

                if (!voicesReady || !cantoneseVoice) {
                    await waitForVoices();
                }

                window.speechSynthesis.resume();

                const u = new SpeechSynthesisUtterance(String(text));

                if (cantoneseVoice) {
                    u.voice = cantoneseVoice;
                    u.lang = cantoneseVoice.lang || 'zh-HK';
                } else {
                    u.lang = 'zh-HK';
                }

                u.rate = 0.90;
                u.pitch = 1.08;
                u.volume = 1.0;

                u.onerror = (event) => {
                    console.log('粵語語音播放錯誤：', event.error);
                    try {
                        window.speechSynthesis.resume();
                    } catch (e) {}
                };

                window.speechSynthesis.cancel();

                setTimeout(() => {
                    try {
                        window.speechSynthesis.resume();
                        window.speechSynthesis.speak(u);
                    } catch (e) {
                        console.log('粵語語音錯誤：', e);
                    }
                }, 40);

            } catch (e) {
                console.log('語音錯誤：', e);
            }
        }

        if ('speechSynthesis' in window) {
            loadCantoneseVoice();
            window.speechSynthesis.addEventListener('voiceschanged', () => {
                loadCantoneseVoice();
            });
        }

        function speakNumber(value) {
            const text = CANTONESE_NUMBERS[value] || String(value);
            speakText(text);
        }

        function updateGazeIndicator() {
            const indicator = document.getElementById('gazeIndicator');
            indicator.style.left = (mouseX - 29) + 'px';
            indicator.style.top = (mouseY - 29) + 'px';
        }

        init();
    </script>
